<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Site editor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f6f4ef; --panel: #fffefb; --ink: #151413; --ink-2: #4a4742; --muted: #85817a;
      --rule: #dedbd3; --rule-2: #ebe8e1; --red: #b3261e; --green: #1f6b3a; --amber: #8a5a00;
      --sans: "Inter", "Noto Sans Georgian", system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: "Newsreader", Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; font-family: var(--sans); background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

    /* ── Shell ── */
    .shell { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    .topbar { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 1.25rem; background: var(--ink); color: #fff; min-height: 56px; }
    .topbar-brand { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin-right: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .body { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; }
    .sidebar { background: var(--panel); border-right: 1px solid var(--rule); overflow-y: auto; padding: 1rem 0 2rem; }
    .side-label { padding: 0 1.1rem; margin: 1.1rem 0 0.35rem; font-size: 0.64rem; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    .side-label:first-child { margin-top: 0; }
    .side-item { display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 0.5rem 1.1rem 0.5rem calc(1.1rem - 3px); font-size: 0.88rem; color: var(--ink-2); }
    .side-item:hover { background: var(--paper); color: var(--ink); }
    .side-item.active { background: var(--paper); border-left-color: var(--ink); color: var(--ink); font-weight: 600; }
    .main { overflow-y: auto; padding: 2rem clamp(1rem, 4vw, 3rem) 6rem; }
    .page { max-width: 820px; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.5rem 0.95rem; border: 1px solid var(--rule); background: var(--panel); font-size: 0.8rem; font-weight: 600; border-radius: 4px; text-decoration: none; white-space: nowrap; transition: background 120ms, border-color 120ms, opacity 120ms; }
    .btn:hover { border-color: #b9b5ab; }
    .btn:disabled { opacity: 0.45; cursor: default; }
    .btn-primary { background: #fff; color: var(--ink); border-color: #fff; }
    .btn-primary:hover { background: #e9e6df; }
    .btn-dark { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn-dark:hover { opacity: 0.85; }
    .btn-ghost { background: transparent; border-color: rgba(255,255,255,0.28); color: #fff; }
    .btn-ghost:hover { border-color: #fff; }
    .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.75rem; }
    .btn-danger { color: var(--red); }
    .icon-btn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent; background: none; border-radius: 4px; color: var(--muted); font-size: 0.9rem; line-height: 1; flex: none; }
    .icon-btn:hover:not(:disabled) { color: var(--ink); background: var(--rule-2); }
    .icon-btn.danger:hover { color: var(--red); }
    .icon-btn:disabled { opacity: 0.3; cursor: default; }

    /* ── Status pill ── */
    .status { font-size: 0.74rem; font-weight: 600; padding: 0.3rem 0.65rem; border-radius: 999px; border: 0; background: rgba(255,255,255,0.12); color: #d7d3cb; white-space: nowrap; max-width: 44vw; overflow: hidden; text-overflow: ellipsis; }
    .status[data-state="dirty"] { background: #f4d58a; color: #3d2a00; }
    .status[data-state="ok"] { background: #1f6b3a; color: #d9f5e2; }
    .status[data-state="error"] { background: var(--red); color: #fff; }
    .status[data-state="local"] { background: #5a554c; color: #fff; }

    /* ── Page header ── */
    .page-title { margin: 0; font-family: var(--serif); font-size: 2rem; font-weight: 400; letter-spacing: -0.01em; line-height: 1.1; }
    .page-sub { margin: 0.4rem 0 1.75rem; color: var(--muted); max-width: 60ch; }

    /* ── Cards & fields ── */
    .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .card-title { margin: 0 0 0.2rem; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
    .card-sub { margin: 0 0 1rem; font-size: 0.82rem; color: var(--muted); }
    .card-title + .field, .card-title + .field-row { margin-top: 1rem; }
    .field { margin-bottom: 1rem; min-width: 0; }
    .field:last-child { margin-bottom: 0; }
    .field > label, .field-label { display: block; font-size: 0.78rem; font-weight: 600; margin-bottom: 0.3rem; color: var(--ink); }
    .hint { font-size: 0.76rem; color: var(--muted); margin-top: 0.3rem; }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
    .field-row .field { margin-bottom: 0; }
    input[type="text"], input[type="url"], input[type="email"], input[type="password"], textarea {
      display: block; width: 100%; padding: 0.5rem 0.65rem; border: 1px solid var(--rule); background: #fff; border-radius: 4px; font-size: 0.92rem; outline: none; transition: border-color 120ms;
    }
    textarea { resize: vertical; min-height: 4.5rem; line-height: 1.5; }
    textarea.prose-input { font-family: var(--serif); font-size: 1.02rem; line-height: 1.55; }
    input:focus, textarea:focus { border-color: var(--ink); }
    .toggle { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.86rem; font-weight: 500; cursor: pointer; }
    .toggle input { width: 1rem; height: 1rem; accent-color: var(--ink); }

    /* ── Image field ── */
    .img-field { display: flex; gap: 1rem; align-items: flex-start; }
    .img-thumb { width: 96px; height: 128px; object-fit: cover; background: var(--rule-2); border: 1px solid var(--rule); border-radius: 3px; flex: none; }
    .img-empty { display: flex; align-items: center; justify-content: center; text-align: center; font-size: 0.7rem; color: var(--muted); border-style: dashed; padding: 0.4rem; }
    .img-actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .img-name { font-size: 0.76rem; color: var(--muted); margin-bottom: 0.5rem; overflow-wrap: anywhere; }
    .warn { color: var(--red); font-size: 0.8rem; font-weight: 500; margin-bottom: 0.5rem; }

    /* ── Row editor (credits, press, details, links…) ── */
    .rows { border: 1px solid var(--rule); border-radius: 4px; background: #fff; }
    .rows-head, .rows-row { display: grid; gap: 0; align-items: stretch; }
    .rows-head { background: var(--paper); border-bottom: 1px solid var(--rule); border-radius: 4px 4px 0 0; }
    .rows-head span { padding: 0.4rem 0.6rem; font-size: 0.66rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
    .rows-row { border-bottom: 1px solid var(--rule-2); }
    .rows-row:last-child { border-bottom: 0; }
    .rows-row input, .rows-row textarea { border: 0; border-right: 1px solid var(--rule-2); border-radius: 0; background: transparent; font-size: 0.88rem; min-height: 0; resize: none; }
    .rows-row input:focus, .rows-row textarea:focus { background: #fffbea; }
    .rows-ctrl { display: flex; align-items: center; padding: 0 0.2rem; }
    .rows-empty { padding: 0.8rem; font-size: 0.82rem; color: var(--muted); }
    .add-row { margin-top: 0.6rem; }

    /* ── Item list (books, plays, films) ── */
    .item { background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; margin-bottom: 0.6rem; }
    .item.is-hidden .item-head { opacity: 0.55; }
    .item-head { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; }
    .item-open { flex: 1; min-width: 0; display: flex; align-items: center; gap: 0.75rem; background: none; border: 0; padding: 0; text-align: left; }
    .item-thumb { width: 34px; height: 46px; object-fit: cover; background: var(--rule-2); border-radius: 2px; flex: none; }
    .item-name { font-weight: 600; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: 0.76rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-ctrl { display: flex; align-items: center; gap: 0.1rem; flex: none; }
    .badge { font-size: 0.64rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; background: var(--rule-2); color: var(--ink-2); padding: 0.15rem 0.45rem; border-radius: 3px; margin-left: 0.5rem; }
    .item-body { border-top: 1px solid var(--rule); padding: 1.25rem; }
    .item-foot { display: flex; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--rule-2); }
    .list-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 1.75rem 0 0.75rem; }
    .list-head h2 { margin: 0; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }

    /* ── Image library / modal ── */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; }
    .tile { position: relative; background: #fff; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; padding: 0; text-align: left; display: block; width: 100%; }
    button.tile:hover { border-color: var(--ink); }
    .tile.selected { outline: 2px solid var(--ink); }
    .tile img, .tile-file { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; background: var(--rule-2); }
    .tile-file { display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--muted); letter-spacing: 0.1em; }
    .tile-cap { padding: 0.35rem 0.45rem; font-size: 0.68rem; color: var(--ink-2); overflow-wrap: anywhere; line-height: 1.3; }
    .tile-del { position: absolute; top: 4px; right: 4px; background: rgba(255,255,255,0.92); border: 1px solid var(--rule); }
    .tile-used { position: absolute; top: 6px; left: 6px; background: var(--ink); color: #fff; font-size: 0.6rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.1rem 0.35rem; border-radius: 2px; }
    .overlay { position: fixed; inset: 0; background: rgba(21,20,19,0.55); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; }
    .modal { background: var(--panel); border-radius: 8px; width: min(760px, 100%); max-height: 86vh; display: flex; flex-direction: column; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.9rem 1.1rem; border-bottom: 1px solid var(--rule); }
    .modal-head strong { font-size: 0.95rem; }
    .modal-body { padding: 1.1rem; overflow-y: auto; }
    .upload-bar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1rem; }

    /* ── Toast ── */
    #toast { position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 1rem); background: var(--ink); color: #fff; padding: 0.65rem 1.1rem; border-radius: 6px; font-size: 0.86rem; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 200ms, transform 200ms; z-index: 80; max-width: calc(100% - 2rem); }
    #toast.show { opacity: 1; transform: translate(-50%, 0); }
    #toast.error { background: var(--red); }

    @media (max-width: 760px) {
      .body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      .sidebar { display: flex; gap: 0.25rem; overflow-x: auto; padding: 0.5rem 0.75rem; border-right: 0; border-bottom: 1px solid var(--rule); }
      .side-label { display: none; }
      .side-item { width: auto; white-space: nowrap; border-left: 0; border-radius: 999px; padding: 0.4rem 0.8rem; }
      .side-item.active { background: var(--ink); color: #fff; }
      .field-row { grid-template-columns: 1fr; }
      .topbar { padding: 0.5rem 0.75rem; flex-wrap: wrap; }
      .hide-sm { display: none; }
      .rows-head { display: none; }
      .rows-row { grid-template-columns: 1fr auto !important; }
      .rows-row > input, .rows-row > textarea { grid-column: 1; border-right: 0; border-bottom: 1px solid var(--rule-2); }
      .rows-ctrl { grid-column: 2; grid-row: 1 / span 4; flex-direction: column; justify-content: center; border-left: 1px solid var(--rule-2); }
    }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <span class="topbar-brand">Site editor</span>
    <button class="status" id="status" data-state="idle" type="button">Loading…</button>
    <a class="btn btn-ghost hide-sm" href="/" target="_blank" rel="noopener">View site ↗</a>
    <button class="btn btn-primary" id="saveBtn" type="button" disabled>Save &amp; publish</button>
    <a class="btn btn-ghost hide-sm" href="/admin/logout" id="logout">Sign out</a>
  </header>
  <div class="body">
    <nav class="sidebar" id="sidebar" aria-label="Editor pages"></nav>
    <main class="main" id="main"><p class="page-sub">Loading…</p></main>
  </div>
</div>
<div id="toast" role="status"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   Site editor.  `content` mirrors content.json; every input writes
   straight into it, and "Save & publish" sends the whole thing.
   ════════════════════════════════════════════════════════════════ */
let content = null;
let uploads = [];
let hosted = false;
let dirty = false;
let saving = false;
let publishes = true;      // false when the server cannot publish (local development)
let savedOnce = false;
const pending = {};        // uploads not saved yet: filename -> { sha, url }
let currentPage = location.hash.slice(1) || 'home';
const openItems = new WeakSet();

/* ── Tiny DOM helper ───────────────────────────────────────────── */
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k in el && k !== 'list') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  return fill(el, children);
}
/* Replace an element's children; accepts nested arrays, skips null/false. */
function fill(el, ...children) {
  el.replaceChildren(...children.flat(Infinity)
    .filter(c => c != null && c !== false)
    .map(c => (c.nodeType ? c : document.createTextNode(c))));
  return el;
}
/* An <img> for an uploaded file.  Files saved a moment ago may not be on the
   public site yet, so fall back to reading them through the editor. */
function img(name, attrs) {
  const p = pending[name];
  const el = h('img', { ...attrs, alt: '', src: p ? p.url : '/Images/' + encodeURIComponent(name) });
  if (!p) el.addEventListener('error', () => { el.src = '/admin/file/' + encodeURIComponent(name); }, { once: true });
  return el;
}
const uploadExists = name => uploads.some(u => u.name === name);

function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = ''; }, isError ? 6000 : 2600);
}

async function api(method, url, body) {
  const opts = { method, headers: { 'X-Requested-With': 'admin' } };
  if (body instanceof FormData) opts.body = body;
  else if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  let res;
  try { res = await fetch(url, opts); }
  catch (e) { throw new Error('No connection to the server. Check your internet and try again.'); }
  if (res.status === 401) { window.removeEventListener('beforeunload', warnUnsaved); location.href = '/admin/login'; throw new Error('Signed out'); }
  let data = null;
  try { data = await res.json(); } catch (e) { /* not JSON */ }
  if (!res.ok) throw new Error((data && data.error) || 'Something went wrong (' + res.status + ').');
  return data;
}

/* ── Dirty state & status pill ─────────────────────────────────── */
function markDirty() { if (!dirty) { dirty = true; renderStatus(); } }
function warnUnsaved(e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } }
window.addEventListener('beforeunload', warnUnsaved);

function renderStatus() {
  const pill = document.getElementById('status');
  const btn = document.getElementById('saveBtn');
  let state = 'idle', text = 'Everything is published';
  if (saving) { state = 'pushing'; text = 'Saving…'; }
  else if (dirty) { state = 'dirty'; text = 'Unsaved changes'; }
  else if (!publishes) { state = 'local'; text = savedOnce ? 'Saved (not published)' : 'Not connected to the live site'; }
  else if (savedOnce) { state = 'ok'; text = 'Published ✓'; }
  pill.dataset.state = state;
  pill.textContent = text;
  pill.title = state === 'ok' ? 'The live site updates in about a minute.' : '';
  btn.disabled = saving || !dirty;
  btn.textContent = saving ? 'Saving…' : 'Save & publish';
}

async function save() {
  if (saving || !dirty) return;
  saving = true; renderStatus();
  try {
    const new_files = Object.fromEntries(Object.entries(pending).map(([name, p]) => [name, p.sha]));
    const data = await api('PUT', '/api/content', { content, new_files });
    // Keep editing the same objects (the form is bound to them); only take
    // over what the server decides: the ids of new items.
    for (const key of ['books', 'theatre_plays', 'films']) {
      content[key].forEach((it, i) => { if (data.content[key][i]) it.id = data.content[key][i].id; });
    }
    uploads = data.uploads;
    for (const name of Object.keys(new_files)) delete pending[name];
    dirty = false; savedOnce = true;
    toast(publishes ? 'Published. The live site updates in about a minute.' : 'Saved.');
  } catch (e) {
    toast(e.message, true);
  }
  saving = false; renderStatus();
}
document.getElementById('saveBtn').addEventListener('click', save);
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
});

/* ════════════════════════════════════════════════════════════════
   Field builders — each returns a DOM node bound to obj[key].
   ════════════════════════════════════════════════════════════════ */
function autoGrow(ta) {
  const fit = () => { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; };
  ta.addEventListener('input', fit);
  requestAnimationFrame(fit);
}

function wrap(label, control, hint) {
  return h('div', { class: 'field' }, label && h('label', {}, label), control, hint && h('p', { class: 'hint' }, hint));
}

function text(obj, key, label, opt = {}) {
  const input = h('input', {
    type: opt.type || 'text', value: obj[key] || '', placeholder: opt.placeholder || '',
    oninput: e => { obj[key] = e.target.value; markDirty(); if (opt.onchange) opt.onchange(); },
  });
  return wrap(label, input, opt.hint);
}

function area(obj, key, label, opt = {}) {
  const ta = h('textarea', {
    value: obj[key] || '', rows: opt.rows || 3, placeholder: opt.placeholder || '', class: opt.prose ? 'prose-input' : '',
    oninput: e => { obj[key] = e.target.value; markDirty(); },
  });
  autoGrow(ta);
  return wrap(label, ta, opt.hint);
}

const RICH_HINT = 'Leave an empty line between paragraphs. *Stars* make italics; [text](https://…) makes a link.';

/* A list of paragraphs edited as one text box. */
function paragraphs(obj, key, label, opt = {}) {
  const ta = h('textarea', {
    class: 'prose-input', rows: 6, value: (obj[key] || []).join('\n\n'),
    oninput: e => { obj[key] = e.target.value.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean); markDirty(); },
  });
  autoGrow(ta);
  return wrap(label, ta, opt.hint || RICH_HINT);
}

/* A list of short strings, one per line. */
function lines(obj, key, label, hint) {
  const ta = h('textarea', {
    rows: 4, value: (obj[key] || []).join('\n'),
    oninput: e => { obj[key] = e.target.value.split('\n').map(s => s.trim()).filter(Boolean); markDirty(); },
  });
  autoGrow(ta);
  return wrap(label, ta, hint);
}

function toggle(obj, key, label, onchange) {
  return h('label', { class: 'toggle' },
    h('input', { type: 'checkbox', checked: !!obj[key], onchange: e => { obj[key] = e.target.checked; markDirty(); if (onchange) onchange(); } }),
    label);
}

function row(...fields) { return h('div', { class: 'field-row' }, fields); }

function image(obj, key, label, hint) {
  const box = h('div', { class: 'field' });
  const draw = () => {
    const name = obj[key];
    const missing = name && !uploadExists(name);
    fill(box, 
      h('span', { class: 'field-label' }, label),
      h('div', { class: 'img-field' },
        name && !missing
          ? img(name, { class: 'img-thumb' })
          : h('div', { class: 'img-thumb img-empty' }, missing ? 'File missing' : 'No image'),
        h('div', {},
          missing && h('p', { class: 'warn' }, 'The file “' + name + '” is no longer on the server. Please choose the image again.'),
          name && !missing && h('p', { class: 'img-name' }, name),
          h('div', { class: 'img-actions' },
            h('button', { class: 'btn btn-sm', type: 'button', onclick: () => pickFile('image', name, picked => { obj[key] = picked; markDirty(); draw(); refreshItemHeads(); }) }, name ? 'Change image' : 'Choose image'),
            name && h('button', { class: 'btn btn-sm btn-danger', type: 'button', onclick: () => { obj[key] = ''; markDirty(); draw(); refreshItemHeads(); } }, 'Remove')),
          hint && h('p', { class: 'hint' }, hint))));
  };
  draw();
  return box;
}

/* A link that can be typed or filled by uploading a file (PDF). */
function fileLink(obj, key, label, hint) {
  const input = h('input', { type: 'text', value: obj[key] || '', placeholder: 'https://…  or upload a PDF', oninput: e => { obj[key] = e.target.value; markDirty(); } });
  const btn = h('button', { class: 'btn btn-sm', type: 'button', style: 'margin-top:0.5rem', onclick: () => pickFile('file', '', picked => { obj[key] = '/Images/' + encodeURIComponent(picked); input.value = obj[key]; markDirty(); }) }, 'Upload / choose a file');
  return h('div', { class: 'field' }, h('label', {}, label), input, btn, hint && h('p', { class: 'hint' }, hint));
}

/* Table-like editor for a list of small objects. */
function rows(list, columns, opt = {}) {
  const box = h('div', { class: 'field' });
  const tpl = columns.map(c => (c.width || '1fr')).join(' ') + ' auto';
  const draw = () => {
    const table = h('div', { class: 'rows' },
      h('div', { class: 'rows-head', style: 'grid-template-columns:' + tpl }, columns.map(c => h('span', {}, c.label)), h('span', {})),
      list.length ? list.map((item, i) => h('div', { class: 'rows-row', style: 'grid-template-columns:' + tpl },
        columns.map(c => {
          const input = h(c.long ? 'textarea' : 'input', {
            type: c.long ? null : 'text', rows: c.long ? 1 : null, value: item[c.key] || '', placeholder: c.label, 'aria-label': c.label,
            oninput: e => { item[c.key] = e.target.value; markDirty(); },
          });
          if (c.long) autoGrow(input);
          return input;
        }),
        h('div', { class: 'rows-ctrl' },
          h('button', { class: 'icon-btn', type: 'button', title: 'Move up', disabled: i === 0, onclick: () => move(i, -1) }, '↑'),
          h('button', { class: 'icon-btn', type: 'button', title: 'Move down', disabled: i === list.length - 1, onclick: () => move(i, 1) }, '↓'),
          h('button', { class: 'icon-btn danger', type: 'button', title: 'Delete row', onclick: () => { list.splice(i, 1); markDirty(); draw(); } }, '✕'))))
      : h('div', { class: 'rows-empty' }, opt.empty || 'Nothing here yet.'));
    fill(box, 
      opt.label && h('span', { class: 'field-label' }, opt.label),
      table,
      h('button', { class: 'btn btn-sm add-row', type: 'button', onclick: () => {
        list.push(Object.fromEntries(columns.map(c => [c.key, '']))); markDirty(); draw();
        const inputs = box.querySelectorAll('.rows-row:last-child input, .rows-row:last-child textarea');
        if (inputs[0]) inputs[0].focus();
      } }, '+ ' + (opt.add || 'Add row')),
      opt.hint && h('p', { class: 'hint' }, opt.hint));
  };
  const move = (i, d) => { const [it] = list.splice(i, 1); list.splice(i + d, 0, it); markDirty(); draw(); };
  draw();
  return box;
}

function card(title, sub, ...children) {
  return h('section', { class: 'card' }, title && h('h2', { class: 'card-title' }, title), sub && h('p', { class: 'card-sub' }, sub), children);
}

let refreshItemHeads = () => {};

function works(list, opt) {
  const box = h('div', {});
  const draw = () => {
    fill(box, 
      h('div', { class: 'list-head' },
        h('h2', {}, opt.title),
        h('button', { class: 'btn btn-sm btn-dark', type: 'button', onclick: () => {
          const item = { id: '', visible: true, label: '', title: '', image: '', meta_line1: '', meta_line2: '', summary: '', paragraphs: [], details: [], links: [] };
          list.unshift(item); openItems.add(item); markDirty(); draw();
          const first = box.querySelector('.item-body input'); if (first) first.focus();
        } }, '+ Add ' + opt.noun)),
      list.length ? list.map((item, i) => workItem(item, i)) : h('p', { class: 'card-sub' }, 'No ' + opt.noun + 's yet.'));
  };
  const move = (i, d) => { const [it] = list.splice(i, 1); list.splice(i + d, 0, it); markDirty(); draw(); };

  function workItem(item, i) {
    const isOpen = openItems.has(item);
    const thumbOk = item.image && uploadExists(item.image);
    const el = h('div', { class: 'item' + (item.visible ? '' : ' is-hidden') },
      h('div', { class: 'item-head' },
        h('button', { class: 'item-open', type: 'button', 'aria-expanded': String(isOpen), onclick: () => { isOpen ? openItems.delete(item) : openItems.add(item); draw(); } },
          thumbOk ? img(item.image, { class: 'item-thumb' }) : h('span', { class: 'item-thumb' }),
          h('span', { style: 'min-width:0' },
            h('span', { class: 'item-name', style: 'display:block' }, item.title || 'Untitled', !item.visible && h('span', { class: 'badge' }, 'Hidden')),
            h('span', { class: 'item-sub', style: 'display:block' }, [item.label, item.meta_line1].filter(Boolean).join(' · ') || (isOpen ? 'Editing' : 'Click to edit')))),
        h('div', { class: 'item-ctrl' },
          h('button', { class: 'icon-btn', type: 'button', title: 'Move up', disabled: i === 0, onclick: () => move(i, -1) }, '↑'),
          h('button', { class: 'icon-btn', type: 'button', title: 'Move down', disabled: i === list.length - 1, onclick: () => move(i, 1) }, '↓'),
          h('button', { class: 'btn btn-sm', type: 'button', onclick: () => { isOpen ? openItems.delete(item) : openItems.add(item); draw(); } }, isOpen ? 'Close' : 'Edit'))),
      isOpen && h('div', { class: 'item-body' },
        row(text(item, 'title', 'Title', { onchange: () => { el.querySelector('.item-name').firstChild.textContent = item.title || 'Untitled'; } }),
            text(item, 'label', 'Small label above the title', { placeholder: opt.labelExample })),
        image(item, 'image', opt.imageLabel),
        row(text(item, 'meta_line1', 'Line under the title', { placeholder: opt.metaExample }),
            text(item, 'meta_line2', 'Second line (optional)')),
        area(item, 'summary', 'Short summary (shown in the list)', { rows: 2, hint: 'Optional. If empty, the beginning of the full text is shown.' }),
        paragraphs(item, 'paragraphs', 'Full text (shown on the ' + opt.noun + '’s own page)'),
        rows(item.details, [{ key: 'key', label: 'Name', width: '11rem' }, { key: 'value', label: 'Value', long: true }],
          { label: 'Details', add: 'Add detail', empty: 'For example: Director, Year, Publisher, ISBN, Awards…', hint: opt.detailsHint }),
        rows(item.links, [{ key: 'label', label: 'Button text', width: '12rem' }, { key: 'url', label: 'Link (https://…)' }],
          { label: 'Buttons / links', add: 'Add link', empty: 'For example: ' + opt.linkExample }),
        h('div', { class: 'item-foot' },
          toggle(item, 'visible', 'Show on the website', draw),
          h('button', { class: 'btn btn-sm btn-danger', type: 'button', onclick: () => {
            if (confirm('Delete “' + (item.title || 'Untitled') + '”? This cannot be undone after saving.')) { list.splice(i, 1); markDirty(); draw(); }
          } }, 'Delete ' + opt.noun))));
    return el;
  }
  refreshItemHeads = draw;
  draw();
  return box;
}

function libraryGrid(kind, opt = {}) {

  const list = uploads.filter(u => !kind || u.kind === kind);
  if (!list.length) return h('p', { class: 'card-sub' }, 'Nothing uploaded yet.');
  for (const u of list) {
    const visual = u.kind === 'image' ? img(u.name, { loading: 'lazy' }) : h('span', { class: 'tile-file' }, u.name.split('.').pop().toUpperCase());
    const cap = h('span', { class: 'tile-cap', style: 'display:block' }, u.name);
    if (opt.onpick) {
      grid.append(h('button', { class: 'tile' + (opt.selected === u.name ? ' selected' : ''), type: 'button', onclick: () => opt.onpick(u.name) }, visual, cap));
    } else {
      grid.append(h('div', { class: 'tile' }, visual, cap,
        u.used ? h('span', { class: 'tile-used' }, 'In use')
               : pending[u.name] ? h('span', { class: 'tile-used' }, 'Not saved yet')
               : h('button', { class: 'icon-btn danger tile-del', type: 'button', title: 'Delete', onclick: async () => {
                   if (!confirm('Delete “' + u.name + '”?')) return;
                   try { const d = await api('DELETE', '/api/images/' + encodeURIComponent(u.name)); uploads = d.uploads.concat(uploads.filter(x => pending[x.name])); render(); toast('Deleted.'); }
                   catch (e) { toast(e.message, true); }
                 } }, '✕')));
    }
  }
  return grid;
}

/* Photos are shrunk here in the browser: the server accepts 4 MB at most. */
const MAX_UPLOAD = 4 * 1024 * 1024;
async function prepareUpload(file) {
  const tooBig = () => new Error('This file is larger than 4 MB. Please make it smaller and try again.');
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { if (file.size > MAX_UPLOAD) throw tooBig(); return file; }
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { if (file.size > MAX_UPLOAD) throw tooBig(); return file; }
  const scale = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
  if (scale === 1 && file.size <= 1.5 * 1024 * 1024) return file;
  const canvas = h('canvas', { width: Math.round(bmp.width * scale), height: Math.round(bmp.height * scale) });
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.86));
  if (!blob || blob.size > MAX_UPLOAD) throw tooBig();
  return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
}

function uploadButton(kind, ondone) {
  const input = h('input', { type: 'file', multiple: true, hidden: true, accept: kind === 'file' ? '.pdf,application/pdf' : kind === 'image' ? 'image/*' : 'image/*,.pdf' });
  const btn = h('button', { class: 'btn btn-dark', type: 'button', onclick: () => input.click() }, 'Upload from this device');
  input.addEventListener('change', async () => {
    const files = [...input.files]; if (!files.length) return;
    btn.disabled = true; let last = null;
    for (const [i, original] of files.entries()) {
      btn.textContent = 'Uploading ' + (i + 1) + ' of ' + files.length + '…';
      try {
        const file = await prepareUpload(original);
        const fd = new FormData(); fd.append('file', file, file.name);
        const d = await api('POST', '/api/upload', fd);
        // Staged on the server; it joins the site at the next "Save & publish".
        if (!uploads.some(u => u.name === d.filename)) {
          pending[d.filename] = { sha: d.sha, url: URL.createObjectURL(file) };
          uploads.push({ name: d.filename, kind: d.kind, size: d.size, used: false });
          markDirty();
        }
        last = d.filename;
      } catch (e) { toast(original.name + ': ' + e.message, true); }
    }
    btn.disabled = false; btn.textContent = 'Upload from this device'; input.value = '';
    if (last) ondone(last, files.length);
  });
  return h('span', {}, btn, input);
}

/* Modal to choose (or upload) an image / file. */
function pickFile(kind, selected, onpick) {
  const body = h('div', { class: 'modal-body' });
  const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  const choose = name => { close(); onpick(name); };
  const draw = () => fill(body, 
    h('div', { class: 'upload-bar' }, uploadButton(kind, (name, count) => { count === 1 ? choose(name) : draw(); }),
      h('span', { class: 'hint', style: 'margin:0' }, kind === 'file' ? 'PDF files.' : 'Or pick one you uploaded before:')),
    libraryGrid(kind, { onpick: choose, selected }));
  const overlay = h('div', { class: 'overlay', onclick: e => { if (e.target === overlay) close(); } },
    h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
      h('div', { class: 'modal-head' }, h('strong', {}, kind === 'file' ? 'Choose a file' : 'Choose an image'),
        h('button', { class: 'icon-btn', type: 'button', title: 'Close', onclick: close }, '✕')),
      body));
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  draw();
  document.body.append(overlay);
}

  fill(document.getElementById('main'), h('div', { class: 'page' },
    h('h1', { class: 'page-title' }, page.name),
    h('p', { class: 'page-sub' }, page.sub),
    page.build()));
  dirty = wasDirty;   // building a page never counts as an edit
  renderStatus();
}

document.getElementById('logout').addEventListener('click', e => {
  if (dirty && !confirm('You have unsaved changes. Sign out anyway?')) e.preventDefault();
  else window.removeEventListener('beforeunload', warnUnsaved);
});

(async function init() {
  try {
    const data = await api('GET', '/api/content');
    content = data.content; uploads = data.uploads; publishes = data.publishes; hosted = data.hosted;
    document.querySelector('.topbar-brand').textContent = 'Site editor — ' + content.site.name;
    render();
  } catch (e) {
    fill(document.getElementById('main'), h('p', { class: 'warn' }, e.message));
  }
})();
</script>
</body>
</html>
